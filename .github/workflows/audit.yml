name: audit

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'script under .github/audit/'
        default: 'run.js'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run audit
        run: |
          mkdir -p docs/audit
          node .github/audit/${{ github.event.inputs.script || 'run.js' }} 2>&1 | tee docs/audit/log.txt || true
      - name: Commit results
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f docs/audit || true
          if ! git diff --cached --quiet; then
            git commit -m "audit: results [skip ci]"
            git pull --rebase --autostash origin main && git push origin HEAD:main
          fi
