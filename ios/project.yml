name: TSTZM
options:
  bundleIdPrefix: com.Hao-Yi-Miao
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  TSTZM:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: TSTZMWidget
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.Hao-Yi-Miao.TSTZ-M
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: TSTZ-M
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        ALTAppGroups:
          - group.com.Hao-Yi-Miao.TSTZ-M
        CFBundleURLTypes:
          - CFBundleURLName: com.Hao-Yi-Miao.TSTZ-M
            CFBundleURLSchemes:
              - tstzm
        NSPhotoLibraryUsageDescription: 选择要随反馈一起提交的截图
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Hao-Yi-Miao.TSTZ-M
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        # Xcode 直装（Debug）：标识后面补上团队 ID，与 SideStore 重签后的标识完全一致，装上去就是覆盖同一个应用，不会再多出一个图标。
        # 免费账号拿不到 App Group，所以 Debug 用不带 App Group 的权限文件。CI 打包的 Release 不受影响。
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.Hao-Yi-Miao.TSTZ-M.$(DEVELOPMENT_TEAM)
          CODE_SIGN_ENTITLEMENTS: Config/AppDebug.entitlements
  TSTZMWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    entitlements:
      path: Config/Widget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.Hao-Yi-Miao.TSTZ-M
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: TSTZ-M
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ALTAppGroups:
          - group.com.Hao-Yi-Miao.TSTZ-M
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Hao-Yi-Miao.TSTZ-M.Widget
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        # 扩展标识 = 应用标识 + .Widget，SideStore 重签后是「应用标识.团队ID.Widget」，这里同样拼法
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.Hao-Yi-Miao.TSTZ-M.$(DEVELOPMENT_TEAM).Widget
          CODE_SIGN_ENTITLEMENTS: Config/WidgetDebug.entitlements
