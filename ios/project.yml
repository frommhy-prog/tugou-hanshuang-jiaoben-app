name: TSTZM
options:
  bundleIdPrefix: com.Hao-Yi-Miao
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  TSTZM:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: TSTZMWidget
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.Hao-Yi-Miao.TSTZ-M
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: TSTZ-M
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        ALTAppGroups:
          - group.com.Hao-Yi-Miao.TSTZ-M
        CFBundleURLTypes:
          - CFBundleURLName: com.Hao-Yi-Miao.TSTZ-M
            CFBundleURLSchemes:
              - tstzm
        NSPhotoLibraryUsageDescription: 选择要随反馈一起提交的截图
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Hao-Yi-Miao.TSTZ-M
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  TSTZMWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    entitlements:
      path: Config/Widget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.Hao-Yi-Miao.TSTZ-M
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: TSTZ-M
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ALTAppGroups:
          - group.com.Hao-Yi-Miao.TSTZ-M
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Hao-Yi-Miao.TSTZ-M.Widget
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
